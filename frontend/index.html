<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Dialysis Session Intake and Anomaly Detection Dashboard for managing patient dialysis sessions and surfacing clinical anomalies." />
  <title>Dialysis Dashboard</title>
  <script>
    // Runs before first paint so the themed class is on <html> when the first
    // frame is composited. Without this the dark `:root` defaults render for a
    // frame and light-mode users see the whole chrome flash dark on every load.
    (function () {
      try {
        var stored = localStorage.getItem('dialysis-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.add(theme);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
